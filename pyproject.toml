[project]
name = "agentic-bi-platform"
version = "0.1.0"
description = "Agentic AI Data Analyst / BI platform using LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "faiss-cpu>=1.15.0",
    "faker>=40.38.0",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.1",
    "langchain-classic>=1.0.8",
    "langchain-cohere>=0.6.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "pandaserd>=0.1.5",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=6.0.1",
    "unstructured>=0.27.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_bi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that invoke language models",
]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
